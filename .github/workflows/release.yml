name: release

# Builds the linux/amd64 and linux/arm64 images on native runners and
# publishes them as one multi-arch image to ghcr.io/<owner>/vitrine.
# Releases are tagged by hand: pushing a tag vX.Y.Z publishes X.Y.Z; a manual
# run publishes the version in cmd/vitrine/version.go.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vitrine

jobs:
  prepare:
    name: Parse version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      alpine: ${{ steps.parse.outputs.alpine }}
      latest: ${{ steps.parse.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse version and base image from the repository
        id: parse
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          CODE_VERS=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' cmd/vitrine/version.go)
          ALPINE=$(grep -E '^FROM alpine:' Dockerfile | tail -n 1 | sed 's/^FROM alpine:\([0-9.]*\).*/\1/')
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$CODE_VERS"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Error: '$VERSION' is not a version (X.Y.Z)"
            exit 1
          fi
          if [ -z "$ALPINE" ]; then
            echo "Error: no 'FROM alpine:' in the Dockerfile"
            exit 1
          fi
          # a tag has to match the version in the source
          if [ "$REF_TYPE" = "tag" ] && [ "${VERSION%%-*}" != "${CODE_VERS%%-*}" ]; then
            echo "Error: tag $REF_NAME does not match version $CODE_VERS in cmd/vitrine/version.go"
            exit 1
          fi
          # pre-releases do not move "latest"
          LATEST=true
          case "$VERSION" in *-*) LATEST=false ;; esac
          echo "VERSION: '${VERSION}'"
          echo "ALPINE: '${ALPINE}'"
          echo "LATEST: '${LATEST}'"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "alpine=${ALPINE}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: linux/amd64
            runs-on: ubuntu-24.04
          - arch: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize Architectures Tags
        id: normalize
        run: |
          ARCH_TAG=$(echo "${{ matrix.arch }}" | xargs basename | tr -d '[:space:]')
          echo "${ARCH_TAG}"
          echo "arch_tag=${ARCH_TAG}" >> "$GITHUB_OUTPUT"
      # A tag belongs to no branch: tagged releases report the branch "release".
      # Each architecture is pushed by digest only, so no intermediate tags
      # exist that would have to be deleted later.
      - name: Build and Push Image (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.arch }}
          pull: true
          no-cache-filters: runtime
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            BRANCH=${{ github.ref_type == 'branch' && github.ref_name || 'release' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ matrix.arch }}
      # Runs the pushed image, so a wrong version, commit or architecture
      # stops the release before the manifest gets its tags.
      - name: Check the image version (${{ matrix.arch }})
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          OUT=$(docker run --rm --platform "$PLATFORM" "$IMAGE" --version)
          echo "$OUT"
          HEAD=$(echo "$OUT" | head -n 1)
          case "$HEAD" in
            "vitrine, version ${VERSION} ("*) ;;
            *) echo "Error: expected version ${VERSION}"; exit 1 ;;
          esac
          case "$HEAD" in
            *"revision: ${REVISION})") ;;
            *) echo "Error: expected revision ${REVISION}"; exit 1 ;;
          esac
          if ! echo "$OUT" | grep -Eq "^[[:space:]]*Platform:[[:space:]]+${PLATFORM}$"; then
            echo "Error: expected platform ${PLATFORM}"
            exit 1
          fi
          echo "OK: ${VERSION} ${REVISION:0:7} ${PLATFORM}"
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.normalize.outputs.arch_tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create and Push Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and Push Manifest linux/amd64, linux/arm64
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ALPINE: ${{ needs.prepare.outputs.alpine }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS=(--tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${VERSION}-alpine${ALPINE}")
          if [ "$LATEST" = "true" ]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi
          if [ "$(ls | wc -l)" != "2" ]; then
            echo "Error: expected the digests of 2 architectures"
            ls
            exit 1
          fi
          docker buildx imagetools create "${TAGS[@]}" $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  cleanup:
    name: Cleanup Untagged Images
    runs-on: ubuntu-slim
    needs:
      - prepare
      - merge
    permissions:
      packages: write
    steps:
      - name: Cleanup Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          delete-untagged: true
          owner: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ env.IMAGE_NAME }}
