name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (video thumbnail tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/vitrine

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Committed build output is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- web/public)" ]; then
            git status --short -- web/public
            echo "web/public differs from the frontend sources, run 'npm run build' in frontend/ and commit it"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vitrine:ci --build-arg REVISION=${{ github.sha }} --build-arg BRANCH=${{ github.ref_name }} .
      - run: docker run --rm vitrine:ci --version
      - name: Container becomes healthy
        run: |
          docker run -d --name vitrine-ci --health-interval=2s --health-start-period=1s \
            -v "$PWD/web:/share:ro" vitrine:ci
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' vitrine-ci)
            echo "health: $state"
            [ "$state" = healthy ] && exit 0
            sleep 2
          done
          docker logs vitrine-ci
          exit 1
